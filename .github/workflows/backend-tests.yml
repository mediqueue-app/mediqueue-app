name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: pytest (backend/)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediqueue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/mediqueue_test
      SECRET_KEY: ci-test-secret-key
      APP_ENV: test
      ENVIRONMENT: test
      ENCRYPTION_KEY: 8sWf7I4vjns6NixJl16x2qxGn8UKA0fFAL0s8GF95VQ=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Verify single Alembic head
        run: |
          python -m alembic heads
          test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Run backend tests
        run: pytest -q
