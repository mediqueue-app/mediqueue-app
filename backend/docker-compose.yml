# Staging / local Docker stack: API + PostgreSQL.
# Secrets come from environment or a local .env file — never commit secrets.
#
#   cd backend
#   copy .env.example .env   # set SECRET_KEY, ENCRYPTION_KEY, APP_ENV=staging
#   docker compose up --build
#
# After DB is healthy, migrate + seed (one-shot):
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python -m scripts.seed_doctors_from_ai_json
#   docker compose run --rm api python -m scripts.seed_clinics_from_ai_json
#   docker compose run --rm api python -m scripts.seed_demo_users

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mediqueue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mediqueue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # Seed scripts resolve ../ai/app/data from the backend root (/app → /ai/...).
    volumes:
      - ../ai:/ai:ro
    environment:
      APP_ENV: ${APP_ENV:-staging}
      PROJECT_NAME: ${PROJECT_NAME:-MediQueue API}
      API_V1_PREFIX: ${API_V1_PREFIX:-/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/mediqueue}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MEDIQUEUE_AI_BASE_URL: ${MEDIQUEUE_AI_BASE_URL:-http://host.docker.internal:8001}
      MEDIQUEUE_AI_TIMEOUT_SECONDS: ${MEDIQUEUE_AI_TIMEOUT_SECONDS:-5}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mediqueue_pgdata:
